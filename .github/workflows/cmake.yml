name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x64)
          - os: macos-latest
            name: macOS (ARM)
          - os: windows-latest
            name: Windows (x64)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 180 -C Release

  # The Vulkan backend on lavapipe, Mesa's Vulkan driver that runs on the CPU, so the GPU
  # code paths are checked against the CPU without a GPU on the runner
  vulkan:
    name: Linux (x64, Vulkan on lavapipe)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan
      run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc mesa-vulkan-drivers

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_VULKAN=1

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 300 -C Release

  # The Metal backend on macOS. Hosted runners are virtual machines that may not expose a
  # Metal GPU, so this job guarantees the Metal build compiles and the CPU tests pass in it;
  # the Metal GPU tests run too, but cannot fail the job
  metal:
    name: macOS (ARM, Metal build)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_METAL=1

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 180 -C Release -E test_metal

    - name: Metal GPU tests (when the runner has a Metal GPU)
      continue-on-error: true
      run: ctest --test-dir build --output-on-failure --timeout 300 -C Release -R test_metal

  # The CUDA backend in NVIDIA's CUDA container. Hosted runners have no NVIDIA GPU, so this
  # job guarantees the CUDA build compiles and the CPU tests pass in it; test_cuda needs a
  # GPU and is left out
  cuda:
    name: Linux (x64, CUDA build)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04

    steps:
    - name: Install build tools
      run: apt-get update && apt-get install -y --no-install-recommends cmake git build-essential

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=1

    - name: Build
      run: cmake --build build --config Release -j 4

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 180 -C Release -E test_cuda
