name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # the tag must name the version in ann.h, the one place it is set
    - name: Check the tag matches ann.h
      run: |
        header=$(sed -n 's/^#define ANN_VERSION_STRING[[:space:]]*"\(.*\)"/\1/p' ann.h)
        if [ "$header" != "${{ steps.version.outputs.VERSION }}" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match ANN_VERSION_STRING \"$header\" in ann.h"
          exit 1
        fi

    - name: Create source archives
      run: |
        git archive --format=tar.gz --prefix=libann-${{ steps.version.outputs.VERSION }}/ -o libann-${{ steps.version.outputs.VERSION }}-source.tar.gz HEAD
        git archive --format=zip --prefix=libann-${{ steps.version.outputs.VERSION }}/ -o libann-${{ steps.version.outputs.VERSION }}-source.zip HEAD

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          libann-${{ steps.version.outputs.VERSION }}-source.tar.gz
          libann-${{ steps.version.outputs.VERSION }}-source.zip
